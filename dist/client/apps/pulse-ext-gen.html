const F_BACKGROUND = `// Pulse AI — Background Service Worker (MV3)
// Handles persistent alarms that survive popup close.

chrome.alarms.onAlarm.addListener((alarm) => {
  if (!alarm.name.startsWith('pulse_')) return;
  const message = decodeURIComponent(alarm.name.slice(6));
  chrome.notifications.create('pulse_' + Date.now(), {
    type: 'basic',
    iconUrl: 'icons/icon48.png',
    title: 'Pulse Reminder',
    message,
    requireInteraction: false,
  });
});

chrome.notifications.onClicked.addListener((id) => {
  chrome.notifications.clear(id);
});`;

const F_README = `# Pulse AI — Chrome Extension

Personal AI productivity agent. Vite + React + Manifest V3.

## Project structure

  public/
    manifest.json     <- MV3 manifest
    background.js     <- service worker (alarms, notifications)
    icons/            <- icon16.png, icon48.png, icon128.png (add your own)
  src/
    main.jsx          <- React entry point
    App.jsx           <- Full Pulse UI
  index.html          <- popup shell
  vite.config.js
  package.json

## Setup

  npm install
  npm run build
  # Open chrome://extensions -> Developer mode -> Load unpacked -> select dist/

## Icons

Add PNG icons at public/icons/icon16.png, icon48.png, icon128.png.
The extension loads without them in unpacked/dev mode.

## API Key

The app calls api.anthropic.com directly from the popup.
For production, proxy through a Cloudflare Worker and strip the key server-side.

## Features

- Chat with full tool-use agentic loop
- Notes (add / update / delete / pin)
- Goals with progress rings
- Arbitrary KV store
- HTTP request tool (GET/POST/PUT/PATCH/DELETE any URL)
- Persistent reminders via chrome.alarms (survive popup close)
- Conversation history via chrome.storage.local
- Model selector: Haiku 4.5 / Sonnet 4.6
- Configurable system prompt + max token slider (256 - 32768)`;

const TOOLS = [
  { name: 'add_note',

    input_schema: { type:'object', required:['content'], properties:{
      content:{ type:'string' }, tags:{ type:'array', items:{ type:'string' } }, pinned:{ type:'boolean' }

  { name: 'delete_note',
    description: 'Delete a note by ID prefix',
    input_schema: { type:'object', required:['id_prefix'], properties:{ id_prefix:{ type:'string' } }}},
  { name: 'upsert_goal',

  { name: 'delete_goal',

    input_schema: { type:'object', required:['id_prefix'], properties:{ id_prefix:{ type:'string' } }}},
  { name: 'set_kv',
    description: 'Store arbitrary data by key.',

    }}},

    description: 'Make an HTTP request to any URL.',
    input_schema: { type:'object', required:['method','url'], properties:{
      method:{ type:'string', enum:['GET','POST','PUT','PATCH','DELETE'] },
      url:{ type:'string' },
      headers:{ type:'object' },
      body:{ type:'string' },

    description: 'Schedule a Chrome notification via chrome.alarms (persists after popup close)',
    input_schema: { type:'object', required:['message','delay_minutes'], properties:{

    }}},

async function runTools(calls, state) {
  let s = { ...state, notes:[...state.notes], goals:[...state.goals], kv:{...(state.kv||{})} }
  const results = []
  for (const { name, input, id } of calls) {
    try {
      if (name === 'add_note') {
        const n = { id:uid(), content:input.content, tags:input.tags||[], pinned:!!input.pinned, createdAt:Date.now() }
        s.notes = [...s.notes, n]
        results.push({ id, result:'Note saved [' + n.id + ']' })
      } else if (name === 'update_note') {
        s.notes = s.notes.map(n => n.id.startsWith(input.id_prefix)
          ? { ...n,
              ...(input.content != null && { content: input.content }),
              ...(input.tags    != null && { tags:    input.tags    }),
              ...(input.pinned  != null && { pinned:  input.pinned  }) }
          : n)
        results.push({ id, result:'Note updated' })
      } else if (name === 'delete_note') {
        s.notes = s.notes.filter(n => !n.id.startsWith(input.id_prefix))
        results.push({ id, result:'Note deleted' })
      } else if (name === 'upsert_goal') {
        if (input.existing_id) {
          s.goals = s.goals.map(g => g.id.startsWith(input.existing_id)
            ? { ...g, text:input.text, progress:input.progress } : g)
        } else {
          s.goals = [...s.goals, { id:uid(), text:input.text, progress:input.progress||0, createdAt:Date.now() }]
        }
        results.push({ id, result:'Goal saved' })
      } else if (name === 'delete_goal') {
        s.goals = s.goals.filter(g => !g.id.startsWith(input.id_prefix))
        results.push({ id, result:'Goal deleted' })
      } else if (name === 'set_kv') {
        s.kv = { ...s.kv, [input.key]: input.value }
        results.push({ id, result:'Stored "' + input.key + '"' })
      } else if (name === 'delete_kv') {
        const next = { ...s.kv }; delete next[input.key]; s.kv = next
        results.push({ id, result:'Deleted "' + input.key + '"' })
      } else if (name === 'http_request') {
        const opts = { method:input.method, headers:{ 'Content-Type':'application/json', ...(input.headers||{}) } }
        if (input.body && ['POST','PUT','PATCH'].includes(input.method)) opts.body = input.body
        const r = await fetch(input.url, opts)
        const txt = await r.text()
        results.push({ id, result:'HTTP ' + r.status + '\\n' + txt.slice(0, 3000) })
      } else if (name === 'schedule_reminder') {
        chrome.alarms.create('pulse_' + encodeURIComponent(input.message), { delayInMinutes: input.delay_minutes })
        const at = new Date(Date.now() + input.delay_minutes * 60000)
          .toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
        results.push({ id, result:'Reminder set for ' + at })
      }
    } catch (e) {
      results.push({ id, result:'Error: ' + e.message })
    }
  }
  return { newState: s, results }
}

function buildSys(state, sys) {
  const { notes, goals, kv = {} } = state
  const kk = Object.keys(kv)
  return sys + '\\n\\n=== Session Data ===\\n' +
    'Goals(' + goals.length + '): ' + (goals.length
      ? goals.map(g => '[' + g.id + '] "' + g.text + '" ' + g.progress + '%').join(', ')
      : 'none') + '\\n' +
    'Notes(latest 8): ' + (notes.length
      ? notes.slice(-8).map(n => '[' + n.id + ']' + (n.pinned ? ' PIN' : '') + ' ' + n.content.slice(0,70)).join(' | ')
      : 'none') + '\\n' +
    'KV(' + kk.length + '): ' + (kk.length ? kk.map(k => k + '=' + String(kv[k]).slice(0,50)).join(', ') : 'empty') + '\\n' +
    '====================\\nUse bracketed IDs for update/delete.'
}

async function callAPI(msgs, state, cfg) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model:cfg.model, max_tokens:cfg.maxTokens, system:buildSys(state, cfg.systemPrompt), messages:msgs, tools:TOOLS }),
  })
  if (!r.ok) { const e = await r.text(); throw new Error('API ' + r.status + ': ' + e.slice(0,200)) }
  return r.json()
}

function Ring({ pct }) {
  const r = 12, c = 2 * Math.PI * r
  const col = pct === 100 ? 'var(--gr)' : pct >= 60 ? 'var(--ac)' : 'var(--am)'
  return (
    <svg width="30" height="30" style={{ transform:'rotate(-90deg)', flexShrink:0 }}>
      <circle cx="15" cy="15" r={r} fill="none" stroke="var(--dm)" strokeWidth="2.5" />
      <circle cx="15" cy="15" r={r} fill="none" stroke={col} strokeWidth="2.5"
        strokeDasharray={c} strokeDashoffset={c-(pct/100)*c} strokeLinecap="round"
        style={{ transition:'stroke-dashoffset .5s ease' }} />
    </svg>
  )
}

export default function App() {
  const [cfg,setCfg]=useState(DEF_CFG)
  const [appSt,setAppSt]=useState({notes:[],goals:[],kv:{}})
  const [msgs,setMsgs]=useState([])
  const [disp,setDisp]=useState([])
  const [loading,setLoading]=useState(false)
  const [toolSt,setToolSt]=useState(null)
  const [inp,setInp]=useState('')
  const [convId,setConvId]=useState(null)
  const [convIdx,setConvIdx]=useState([])
  const [tab,setTab]=useState('chat')
  const [showSet,setShowSet]=useState(false)
  const cfgR=useRef(cfg),appStR=useRef(appSt),msgsR=useRef(msgs)
  const dispR=useRef(disp),convIdR=useRef(convId),convIdxR=useRef(convIdx)
  const bottomR=useRef(null),taR=useRef(null)
  useEffect(()=>{cfgR.current=cfg},[cfg])
  useEffect(()=>{appStR.current=appSt},[appSt])
  useEffect(()=>{msgsR.current=msgs},[msgs])
  useEffect(()=>{dispR.current=disp},[disp])
  useEffect(()=>{convIdR.current=convId},[convId])
  useEffect(()=>{convIdxR.current=convIdx},[convIdx])
  useEffect(()=>{bottomR.current?.scrollIntoView({behavior:'smooth'})},[disp,loading])
  useEffect(()=>{
    const el=document.createElement('style');el.textContent=CSS;document.head.appendChild(el)
    ;(async()=>{
      const s=await db.get('settings');if(s){setCfg(s);cfgR.current=s}
      const idx=await db.get('conv_index');if(idx){setConvIdx(idx);convIdxR.current=idx}
    })()
    return()=>document.head.removeChild(el)
  },[])
  const updateCfg=useCallback(u=>{setCfg(p=>{const n={...p,...u};cfgR.current=n;db.set('settings',n);return n})},[])
  const saveConv=useCallback(async(cid,m,d,st,model)=>{
    if(!cid||m.length===0)return
    await db.set('conv_'+cid,{messages:m,display:d,appState:st})
    const title=d.find(x=>x.role==='user')?.content?.slice(0,48)||'Untitled'
    const ex=convIdxR.current.find(x=>x.id===cid)
    const meta={id:cid,title,createdAt:ex?.createdAt||Date.now(),model}
    const ni=[meta,...convIdxR.current.filter(x=>x.id!==cid)]
    convIdxR.current=ni;setConvIdx(ni);await db.set('conv_index',ni)
  },[])
  const newChat=useCallback(()=>{
    const id=uid();setConvId(id);convIdR.current=id
    setMsgs([]);msgsR.current=[];setDisp([]);dispR.current=[]
    setAppSt({notes:[],goals:[],kv:{}});appStR.current={notes:[],goals:[],kv:{}}
    setInp('');setTab('chat');setTimeout(()=>taR.current?.focus(),50)
  },[])
  const loadConv=useCallback(async cid=>{
    const data=await db.get('conv_'+cid);if(!data)return
    const as=data.appState||{notes:[],goals:[],kv:{}}
    setConvId(cid);convIdR.current=cid
    setMsgs(data.messages||[]);msgsR.current=data.messages||[]
    setDisp(data.display||[]);dispR.current=data.display||[]
    setAppSt(as);appStR.current=as;setTab('chat')
  },[])
  const deleteConv=useCallback(async cid=>{
    await db.del('conv_'+cid)
    const ni=convIdxR.current.filter(x=>x.id!==cid)
    convIdxR.current=ni;setConvIdx(ni);await db.set('conv_index',ni)
    if(convIdR.current===cid){setConvId(null);setMsgs([]);setDisp([]);setAppSt({notes:[],goals:[],kv:{}});appStR.current={notes:[],goals:[],kv:{}}}
  },[])
  const send=useCallback(async text=>{
    if(!text.trim()||loading)return
    setInp('');setLoading(true);setToolSt(null)
    let cid=convIdR.current;if(!cid){cid=uid();setConvId(cid);convIdR.current=cid}
    let m=[...msgsR.current,{role:'user',content:text}]
    let d=[...dispR.current,{role:'user',content:text}]
    let st={...appStR.current,notes:[...appStR.current.notes],goals:[...appStR.current.goals],kv:{...(appStR.current.kv||{})}}
    const snap={...cfgR.current}
    setMsgs([...m]);msgsR.current=[...m];setDisp([...d]);dispR.current=[...d]
    try{
      for(let step=0;step<10;step++){
        setToolSt(step===0?null:'\\u26A1 working...')
        const data=await callAPI(m,st,snap);setToolSt(null)
        if(!data.content)break
        const texts=data.content.filter(b=>b.type==='text')
        const tools=data.content.filter(b=>b.type==='tool_use')
        if(texts.length){const txt=texts.map(b=>b.text).join('');d=[...d,{role:'assistant',content:txt}];setDisp([...d]);dispR.current=[...d]}
        if(data.stop_reason==='tool_use'&&tools.length){
          setToolSt('\\u{1F527} '+tools.map(t=>t.name).join(', ')+'...')
          const{newState,results}=await runTools(tools,st)
          st=newState;setAppSt({...st});appStR.current={...st}
          m=[...m,{role:'assistant',content:data.content},{role:'user',content:results.map(r=>({type:'tool_result',tool_use_id:r.id,content:r.result}))}]
          setMsgs([...m]);msgsR.current=[...m];continue
        }
        m=[...m,{role:'assistant',content:data.content}];setMsgs([...m]);msgsR.current=[...m];break
      }
    }catch(e){d=[...d,{role:'assistant',content:'\\u26A0 '+e.message}];setDisp([...d]);dispR.current=[...d]}
    setToolSt(null);setLoading(false)
    await saveConv(cid,msgsR.current,dispR.current,st,snap.model)
  },[loading,saveConv])
  const{notes,goals,kv={}}=appSt
  const kvKeys=Object.keys(kv)
  const curModel=MODELS.find(m=>m.id===cfg.model)||MODELS[1]
  return(
    <div style={{width:'380px',height:'580px',display:'flex',flexDirection:'column',position:'relative',overflow:'hidden'}}>
      <div style={{padding:'9px 11px 7px',borderBottom:'1px solid var(--bd)',display:'flex',alignItems:'center',gap:7,flexShrink:0,background:'var(--sf)'}}>
        <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:13,letterSpacing:-.5}}>\\u26A1 PULSE</span>
        <span style={{flex:1}}/>
        <span style={{fontSize:9,background:'var(--dm)',color:'var(--ac)',padding:'2px 7px',borderRadius:99,fontFamily:"'DM Mono',monospace"}}>{curModel.short}</span>
        <span style={{fontSize:9,background:'var(--dm)',color:'var(--mu)',padding:'2px 7px',borderRadius:99,fontFamily:"'DM Mono',monospace"}}>{cfg.maxTokens.toLocaleString()}</span>
        <button onClick={newChat} title="New chat" style={{background:'none',border:'1px solid var(--bd2)',color:'var(--mu)',cursor:'pointer',borderRadius:6,width:25,height:25,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
        <button onClick={()=>setShowSet(v=>!v)} title="Settings" style={{background:showSet?'var(--dm)':'none',border:'1px solid var(--bd2)',color:showSet?'var(--ac)':'var(--mu)',cursor:'pointer',borderRadius:6,width:25,height:25,fontSize:12,display:'flex',alignItems:'center',justifyContent:'center'}}>\\u2699</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:tab==='chat'?'12px 11px 8px':'8px 9px',display:'flex',flexDirection:'column',gap:tab==='chat'?10:6}}>
        {tab==='chat'&&(<>
          {disp.length===0&&(<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12,paddingBottom:16}}>
            <div style={{fontSize:30}}>\\u26A1</div>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:15,fontWeight:700,color:'var(--tx)',marginBottom:4}}>Ready.</div>
              <div style={{fontSize:11,color:'var(--mu)',lineHeight:1.7}}>Notes  Goals  HTTP  Reminders</div>
            </div>
          </div>)}
          {disp.map((msg,i)=>(
            <div key={i} className="msg-enter" style={{display:'flex',justifyContent:msg.role==='user'?'flex-end':'flex-start'}}>
              <div style={{maxWidth:'83%',background:msg.role==='user'?'linear-gradient(135deg,#0369a1,#1d4ed8)':'var(--sf)',border:msg.role==='user'?'none':'1px solid var(--bd)',borderRadius:msg.role==='user'?'13px 13px 4px 13px':'13px 13px 13px 4px',padding:'9px 12px'}}>
                <p style={{margin:0,fontSize:12.5,lineHeight:1.65,color:msg.role==='user'?'#fff':'var(--tx)',whiteSpace:'pre-wrap'}}>{msg.content}</p>
              </div>
            </div>
          ))}
          {loading&&(<div style={{display:'flex',flexDirection:'column',gap:4}}>
            {toolSt&&<div style={{fontSize:10,color:'var(--ac2)',fontFamily:"'DM Mono',monospace",paddingLeft:4}}>{toolSt}</div>}
            <div><div style={{display:'inline-flex',background:'var(--sf)',border:'1px solid var(--bd)',borderRadius:'13px 13px 13px 4px',padding:'10px 14px',alignItems:'center',gap:3}}>
              <span className="dot"/><span className="dot"/><span className="dot"/>
            </div></div>
          </div>)}
          <div ref={bottomR}/>
        </>)}
        {tab==='goals'&&(goals.length===0?<Empty icon="\\u{1F3AF}" text="Say: set a goal: …"/>:goals.map(g=><GoalCard key={g.id} g={g}/>))}
        {tab==='notes'&&(notes.length===0?<Empty icon="\\u{1F4DD}" text="Say: note: …"/>:[...notes].reverse().map(n=><NoteCard key={n.id} n={n}/>))}
        {tab==='store'&&(kvKeys.length===0?<Empty icon="\\u{1F5C3}" text="Model stores custom data here"/>:kvKeys.map(k=><KvCard key={k} k={k} v={kv[k]}/>))}
        {tab==='history'&&(convIdx.length===0?<Empty icon="\\u{1F4DC}" text="Conversations appear here"/>:convIdx.map(c=><ConvItem key={c.id} conv={c} active={c.id===convId} onSelect={()=>loadConv(c.id)} onDelete={deleteConv}/>))}
      </div>
      {tab==='chat'&&(
        <div style={{padding:'7px 9px 8px',borderTop:'1px solid var(--bd)',flexShrink:0}}>
          <div style={{display:'flex',gap:7,background:'var(--sf)',border:'1px solid var(--bd2)',borderRadius:11,padding:'8px 10px',alignItems:'flex-end'}}>
            <textarea ref={taR} value={inp} onChange={e=>setInp(e.target.value)}
              placeholder="Ask, note, goal, fetch URL…" rows={1}
              onInput={e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px'}}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(inp)}}}
              style={{flex:1,background:'transparent',border:'none',color:'var(--tx)',fontSize:12.5,resize:'none',lineHeight:1.6,maxHeight:100,overflowY:'auto'}}/>
            <button onClick={()=>send(inp)} disabled={!inp.trim()||loading}
              style={{width:29,height:29,borderRadius:8,background:inp.trim()&&!loading?'var(--ac)':'var(--dm)',border:'none',color:'#fff',cursor:inp.trim()&&!loading?'pointer':'default',fontSize:13,flexShrink:0}}>\\u2191</button>
          </div>
        </div>
      )}
      <div style={{display:'flex',borderTop:'1px solid var(--bd)',flexShrink:0,background:'var(--sf)'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{flex:1,padding:'8px 0 7px',background:'none',border:'none',borderTop:'2px solid '+(tab===t.id?'var(--ac)':'transparent'),color:tab===t.id?'var(--ac)':'var(--mu)',cursor:'pointer',fontSize:16,lineHeight:1}}>
            {t.icon}
          </button>
        ))}
      </div>
      {showSet&&<Settings cfg={cfg} onUpdate={updateCfg} onClose={()=>setShowSet(false)}/>}
    </div>
  )
}`;

/* ─── File registry ──────────────────────────────────────────────── */
const FILES = [
  { path:'pulse-ai-extension/public/manifest.json', lang:'json', content:F_MANIFEST  },
  { path:'pulse-ai-extension/public/background.js', lang:'js',   content:F_BACKGROUND },
  { path:'pulse-ai-extension/index.html',           lang:'html', content:F_INDEX_HTML },
  { path:'pulse-ai-extension/src/main.jsx',         lang:'jsx',  content:F_MAIN       },
  { path:'pulse-ai-extension/src/App.jsx',          lang:'jsx',  content:F_APP        },
  { path:'pulse-ai-extension/vite.config.js',       lang:'js',   content:F_VITE       },
  { path:'pulse-ai-extension/package.json',         lang:'json', content:F_PACKAGE    },
  { path:'pulse-ai-extension/.gitignore',           lang:'text', content:F_GITIGNORE  },
  { path:'pulse-ai-extension/README.md',            lang:'md',   content:F_README     },
];

const SEL_PATH = FILES.map(f => f.path.split('/').slice(1).join('/'));
const LC = { json:'#f59e0b', js:'#eab308', jsx:'#0ea5e9', html:'#f97316', text:'#6b7280', md:'#a78bfa' };

/* ─── Generator UI ───────────────────────────────────────────────── */
function GenApp() {
  const [selIdx,  setSelIdx]  = useState(4);
  const [copied,  setCopied]  = useState(false);
  const [zipping, setZipping] = useState(false);
  const [done,    setDone]    = useState(false);
  const file = FILES[selIdx];
  const displayPath = SEL_PATH[selIdx];

  const copy = () => {
    navigator.clipboard.writeText(file.content);
    setCopied(true); setTimeout(() => setCopied(false), 1600);
  };

  const downloadZip = useCallback(async () => {
    setZipping(true); setDone(false);
    try {
      const zip = new JSZip();
      FILES.forEach(f => zip.file(f.path, f.content));
      // placeholder icons so Chrome doesn't complain
      const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#0ea5e9"/><text x="24" y="33" font-size="28" text-anchor="middle" fill="#fff">⚡</text></svg>';
      zip.file('pulse-ai-extension/public/icons/icon16.png',  iconSvg);
      zip.file('pulse-ai-extension/public/icons/icon48.png',  iconSvg);
      zip.file('pulse-ai-extension/public/icons/icon128.png', iconSvg);
      const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{ level:6 } });
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(blob),
        download: 'pulse-ai-extension.zip',
      });
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(a.href);
      setDone(true); setTimeout(() => setDone(false), 3000);
    } catch(e) { alert('Zip failed: ' + e.message); }
    setZipping(false);
  }, []);

  // Build file tree groups
  const groups = [
    { label:'public/', files: FILES.map((f,i)=>({...f,i})).filter(f => f.path.includes('/public/')) },
    { label:'src/',    files: FILES.map((f,i)=>({...f,i})).filter(f => f.path.includes('/src/'))    },
    { label:'root',    files: FILES.map((f,i)=>({...f,i})).filter(f => { const p = SEL_PATH[f.i]; return !p.includes('/'); }) },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>

      {/* Header */}
      <div style={{ padding:'12px 16px', borderBottom:'1px solid #111e30', display:'flex', alignItems:'center', gap:12, flexShrink:0, background:'#080f1a' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:30, height:30, borderRadius:8, background:'linear-gradient(135deg,#0ea5e9,#6366f1)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:15 }}>⚡</div>
          <div>
            <div style={{ fontFamily:'system-ui,sans-serif', fontWeight:800, fontSize:14, letterSpacing:-.5 }}>PULSE AI</div>
            <div style={{ fontSize:10, color:'#3d5470', fontFamily:'monospace', letterSpacing:.4 }}>Chrome Extension · MV3 · Vite + React</div>
          </div>
        </div>
        <div style={{ flex:1 }}/>
        <button onClick={downloadZip} disabled={zipping}
          style={{ padding:'9px 20px', borderRadius:8, background: done ? '#10b981' : 'linear-gradient(135deg,#0ea5e9,#6366f1)', border:'none', color:'#fff', cursor:'pointer', fontSize:13, fontWeight:600, display:'flex', alignItems:'center', gap:8, boxShadow:'0 0 20px rgba(14,165,233,.3)', opacity: zipping ? .7 : 1, transition:'all .2s', minWidth:190, justifyContent:'center' }}>
          {done ? '✓ Downloaded!' : zipping ? '⏳ Zipping…' : '📦 Download ZIP'}
        </button>
      </div>

      {/* Body */}
      <div style={{ flex:1, display:'flex', overflow:'hidden' }}>

        {/* File Tree */}
        <div style={{ width:200, flexShrink:0, borderRight:'1px solid #111e30', overflowY:'auto', padding:'10px 7px', background:'#080f1a' }}>
          <div style={{ fontSize:9, color:'#3d5470', fontFamily:'monospace', letterSpacing:1, textTransform:'uppercase', padding:'3px 8px 10px' }}>Files · 9 + 3 icons</div>
          {groups.map(({ label, files }) => files.length === 0 ? null : (
            <div key={label} style={{ marginBottom:6 }}>
              {label !== 'root' && (
                <div style={{ fontSize:10, color:'#1a2d44', fontFamily:'monospace', padding:'3px 8px', fontWeight:600 }}>📁 {label}</div>
              )}
              {files.map(f => {
                const isActive = f.i === selIdx;
                const fname = SEL_PATH[f.i].split('/').pop();
                return (
                  <div key={f.i} onClick={() => setSelIdx(f.i)}
                    style={{ padding:'6px 8px', paddingLeft:label==='root'?8:16, borderRadius:7, cursor:'pointer', background:isActive?'#0c1525':'transparent', border:'1px solid '+(isActive?'#162034':'transparent'), display:'flex', alignItems:'center', gap:6, marginBottom:2, transition:'all .12s' }}>
                    <span style={{ fontSize:9, fontWeight:700, padding:'1px 5px', borderRadius:99, background:'#1a2d44', color:LC[f.lang]||'#6b7280', fontFamily:'monospace', flexShrink:0 }}>{f.lang}</span>
                    <span style={{ fontSize:11, color:isActive?'#dde6f0':'#3d5470', fontFamily:'monospace', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{fname}</span>
                  </div>
                );
              })}
            </div>
          ))}

          {/* Steps */}
          <div style={{ marginTop:14, padding:'11px 10px', background:'#04080f', borderRadius:9, border:'1px solid #111e30' }}>
            <div style={{ fontSize:9, color:'#3d5470', fontFamily:'monospace', letterSpacing:1, textTransform:'uppercase', marginBottom:8 }}>Setup</div>
            {['1. Download ZIP','2. Unzip folder','3. npm install','4. npm run build','5. chrome://extensions','6. Load unpacked → dist/'].map(s => (
              <div key={s} style={{ fontSize:10, color:'#3d5470', fontFamily:'monospace', marginBottom:4, lineHeight:1.5 }}>{s}</div>
            ))}
          </div>
        </div>

        {/* Code Viewer */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ padding:'8px 14px', borderBottom:'1px solid #111e30', display:'flex', alignItems:'center', gap:8, flexShrink:0, background:'#04080f' }}>
            <span style={{ fontFamily:'monospace', fontSize:11, color:'#dde6f0', flex:1 }}>{displayPath}</span>
            <span style={{ fontSize:10, color:'#3d5470', fontFamily:'monospace' }}>{file.content.split('\n').length} lines</span>
            <button onClick={copy}
              style={{ padding:'4px 12px', borderRadius:6, background:copied?'#10b981':'#0c1525', border:'1px solid '+(copied?'#10b981':'#162034'), color:copied?'#fff':'#3d5470', cursor:'pointer', fontSize:10, fontFamily:'monospace', transition:'all .18s', minWidth:58 }}>
              {copied ? '✓' : 'copy'}
            </button>
          </div>
          <pre style={{ flex:1, overflowY:'auto', padding:'14px 16px', fontSize:11, lineHeight:1.7, color:'#64748b', fontFamily:'monospace', background:'transparent', whiteSpace:'pre-wrap', wordBreak:'break-word' }}>
            {file.content}
          </pre>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GenApp />);
</script>
</body>
</html>
